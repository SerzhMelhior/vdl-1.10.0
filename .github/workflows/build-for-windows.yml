name: Build for windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.10.1'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          curl.exe -L --fail --retry 3 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download FFmpeg' }
          New-Item -ItemType Directory -Force $extract | Out-Null
          tar.exe -xf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract FFmpeg' }
          $ffmpeg = Get-ChildItem $extract -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe was not found in the archive' }
          $actualHash = (Get-FileHash $ffmpeg.FullName -Algorithm SHA256).Hash
          if ($actualHash -ne '3256173F3F8BFFD7DF12227C68ADF68025EDB1832273A9530688A7BB1ED8EDEC') {
            throw "Unexpected ffmpeg.exe SHA-256: $actualHash"
          }
          Copy-Item $ffmpeg.FullName 'packaging/bin/windows/ffmpeg.exe' -Force
          & 'packaging/bin/windows/ffmpeg.exe' -version
      - name: Download yt-dlp (Windows 7 compatible)
        shell: pwsh
        run: |
          $url = 'https://github.com/nicolaasjan/yt-dlp/releases/download/2026.10.29.091737/yt-dlp_win7.exe'
          $target = 'packaging/bin/windows/yt-dlp.exe'
          curl.exe -L --fail --retry 3 -o $target $url
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download yt-dlp' }
          $actualHash = (Get-FileHash $target -Algorithm SHA256).Hash
          if ($actualHash -ne 'A8B176DA9176A8C44A38A5653E0BDD36B1892B618EFB53DBDD869BBF3A84B6AE') {
            throw "Unexpected yt-dlp.exe SHA-256: $actualHash"
          }
          $version = & $target --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '2026.10.29.091737') {
            throw "Unexpected yt-dlp version: $version"
          }
      - name: Install fx-controls into local Maven repository
        run: mvn install:install-file -Dfile='./lib/fx-controls-1.0.jar' -DgroupId='com.github.engatec' -DartifactId='fx-controls' -Dversion='1.0' -Dpackaging='jar' -DgeneratePom='true'
      - name: Build with Maven
        run: mvn clean package -Dassembly=windows
      - name: Copy vdl.jar to binaries folder
        run: cp target/vdl-assembly-windows.jar packaging/bin/windows/vdl.jar
      - name: Create jar for update
        run: cp target/vdl-assembly-windows.jar upd_windows.jar
      - name: Create portable
        run: jpackage --input packaging/bin/windows --name "vdl" --app-version ${{github.event.inputs.version}} --main-jar vdl.jar --main-class com.github.engatec.vdl.MainWrapper --icon packaging/icons/icon.ico --type app-image --java-options "-Dapp.dir=`$APPDIR -Dapp.ytdlp=yt-dlp.exe -Dapp.portable=true -Dapp.logPath=`$APPDIR -Djavafx.cachedir=`$APPDIR\cache"
      - name: Zip portable
        run: 7z a vdl-video-downloader-${{github.event.inputs.version}}-windows-portable.zip vdl/*
      - name: Create installer
        run: jpackage --input packaging/bin/windows --name "vdl" --app-version ${{github.event.inputs.version}} --main-jar vdl.jar --main-class com.github.engatec.vdl.MainWrapper --icon packaging/icons/icon.ico --type msi --java-options "-Dapp.dir=`$APPDIR -Dapp.ytdlp=yt-dlp.exe" --win-dir-chooser --win-shortcut
      - name: Rename installer
        run: mv vdl-${{github.event.inputs.version}}.msi vdl-video-downloader-${{github.event.inputs.version}}-windows.msi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdl_win_package
          path: |
            upd_windows.jar
            vdl-video-downloader-${{github.event.inputs.version}}-windows-portable.zip
            vdl-video-downloader-${{github.event.inputs.version}}-windows.msi
          retention-days: 1
